name: Release

# Bump __version__ in src/plcdiff/__init__.py and CHANGELOG.md, push to main,
# then run this workflow. It builds, publishes to PyPI (trusted publishing),
# and creates the vX.Y.Z tag and GitHub release.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: version
        run: echo "version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/plcdiff/__init__.py)" >> "$GITHUB_OUTPUT"
      - run: uv sync && uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github:
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "v${{ needs.build.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
